<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrip: specimen sheet</title>
    <style>
      /* Layout for this sheet only. The kit itself is src/client/ui/theme.css. */
      .cells { display: flex; flex-wrap: wrap; gap: 14px 14px; margin-top: 12px; align-items: flex-end; }
      .cell { max-width: 100%; }
      .cell .scroll { max-width: 100%; overflow-x: auto; border: 3px solid var(--ink); line-height: 0; }
      .cell canvas { display: block; }
      .cell .cap { margin-top: 3px; }
      .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); margin-top: 12px; }
      .icons > div { border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 6px 6px 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
      .icons .cap { flex-basis: 100%; }
      .swatch { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--ink); vertical-align: middle; }
      .scene { border: 3px solid var(--ink); margin-top: 12px; line-height: 0; }
      .scene canvas { display: block; width: 100%; }
      .bench { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 32px; margin-top: 12px; }
      @media (min-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr) 280px; } }
      .heldbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 0; }
      .heldbar .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .hudbox { position: relative; height: 420px; border: 3px solid var(--ink); margin-top: 12px; overflow: hidden; }
      .hudbox > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .row { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; margin-top: 12px; }
      .sounds { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .section h3 { margin-top: 18px; }
      .stickpad { background: var(--moss); border: 3px solid var(--ink); padding: 8px; display: inline-block; }
    </style>
  </head>
  <body>
    <div id="app" class="page"></div>
    <script type="module" src="/src/client/gallery.ts"></script>
  </body>
</html>
