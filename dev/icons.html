<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Craft World icon sheet</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; background: #0d0f12; color: #e8ecf1; font: 12px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      body { padding: 12px 14px 40px; }
      h1 { font-size: 18px; margin: 0 0 2px; }
      p { margin: 0 0 10px; color: #9aa5b1; }
      p a { color: #6fb7ff; margin-right: 8px; }
      h2 { font-size: 14px; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #2a3038; color: #f2c230; }
      h2 small { color: #7d8794; font-weight: 400; margin-left: 8px; }
      svg { display: block; }
      .strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; margin-bottom: 4px; background: #14171c; border: 1px solid #2a3038; }
      .strip.tiles { background: none; border: 0; padding: 0; gap: 4px; }
      .strip b { color: #7d8794; font-weight: 400; width: 54px; }
      .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .card { border: 1px solid #2a3038; background: #101317; padding: 5px; }
      .card .id { margin-top: 4px; text-align: center; color: #c7ced6; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
      .cells { display: grid; grid-template-columns: repeat(var(--cols, 3), auto); gap: 4px; }
      .cell { display: grid; grid-template-columns: 64px 24px 20px; grid-template-rows: 40px 24px; gap: 0 2px; padding: 3px; border: 1px solid transparent; }
      .cell > :nth-child(1) { grid-row: 1 / 3; align-self: center; }
      .cell > :nth-child(2) { grid-column: 2 / 4; justify-self: center; }
      .cell > :nth-child(3), .cell > :nth-child(4) { align-self: end; }
      .bg-panel { background: #14171c; border-color: #2a3038; }
      .bg-grey { background: linear-gradient(160deg, #3a3f48, #23262c); border-color: #555c68; }
      .bg-green { background: linear-gradient(160deg, #2f6a3c, #183a22); border-color: #4f9a5f; }
      .bg-blue { background: linear-gradient(160deg, #2c5c98, #162f52); border-color: #4f86d9; }
      .bg-purple { background: linear-gradient(160deg, #643a9a, #331c55); border-color: #9a6fe0; }
      .bg-orange { background: linear-gradient(160deg, #b06a26, #5c3411); border-color: #f2a03b; }
      .t { display: grid; place-items: center; border: 1px solid; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Icon sheet</h1>
    <p id="nav"></p>
    <div id="root"></div>
    <script type="module" src="./icons.ts"></script>
  </body>
</html>
